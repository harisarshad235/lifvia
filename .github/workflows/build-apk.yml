name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PaisaFlow-PKR.apk

      - name: Upload PaisaFlow-PKR-Android-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaisaFlow-PKR-Android-APK
          path: PaisaFlow-PKR.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: PaisaFlow PKR Android APK (v1.0.0)
          files: PaisaFlow-PKR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
