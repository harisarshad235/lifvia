  <path d="M156 132H268C314.392 132 348 162.608 348 206C348 246.4 318.5 275.2 276 279.5L354 380H296L224 282H198V380H156V132ZM198 170V244H264C289.4 244 306 228.8 306 207C306 185.2 289.4 170 264 170H198Z" fill="url(#emeraldGrad)"/>

